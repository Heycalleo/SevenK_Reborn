<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kelas 7K SMP Negeri 3 Luwuk</title>
  <desc id="desc">Poster preview untuk website kelas 7K berisi judul, subtitle, dan motif sekolah.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="170" cy="140" r="180" fill="#60a5fa" opacity="0.18"/>
  <circle cx="980" cy="480" r="220" fill="#c084fc" opacity="0.12"/>
  <rect x="80" y="70" width="1040" height="490" rx="28" fill="url(#card)" stroke="rgba(255,255,255,0.2)"/>
  <text x="120" y="220" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">Class Seven K</text>
  <text x="120" y="300" font-family="Arial, sans-serif" font-size="104" font-weight="800" fill="#ffffff">7K</text>
  <text x="120" y="370" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#dbeafe">SMP Negeri 3 Luwuk</text>
  <text x="120" y="420" font-family="Arial, sans-serif" font-size="26" fill="#e2e8f0">Jadwal, struktur kelas, galeri, dan kenangan bersama</text>
  <rect x="120" y="470" width="280" height="54" rx="27" fill="#f8fafc" opacity="0.95"/>
  <text x="186" y="507" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Lihat website</text>
</svg>
